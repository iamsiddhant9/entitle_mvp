version: "3.8"

services:
  db:
    image: postgres:15-alpine
    container_name: entitle_db
    restart: always
    environment:
      POSTGRES_DB: entitle
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d entitle"]
      interval: 3s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: entitle_backend
    restart: always
    command: >
      sh -c "python manage.py migrate &&
             python manage.py seed_schemes &&
             python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./backend:/app
      - ./docs:/docs:ro
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - SECRET_KEY=django-insecure-key-change-in-prod
      - DATABASE_URL=postgres://postgres:password@db:5432/entitle
      - RULES_DIR=/docs/rules
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000
      - CERTIFICATE_VERIFY_BASE_URL=http://localhost:3000/verify/
      # Optional integrations — export these on the host to enable them:
      - GEMINI_API_KEY=${GEMINI_API_KEY:-}
      - GEMINI_MODEL=${GEMINI_MODEL:-gemini-2.5-flash}
      - POLYGON_AMOY_RPC_URL=${POLYGON_AMOY_RPC_URL:-https://rpc-amoy.polygon.technology}
      - WALLET_PRIVATE_KEY=${WALLET_PRIVATE_KEY:-}
      - ELIGIBILITY_REGISTRY_ADDRESS=${ELIGIBILITY_REGISTRY_ADDRESS:-}
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: entitle_frontend
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      - backend

volumes:
  postgres_data:
